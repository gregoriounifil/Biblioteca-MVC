<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Autores</title></head>
<body>
<nav th:replace="~{fragmentos/nav :: menu}"></nav>
<h1>Autores</h1>
<a th:href="@{/autores/novo}">Novo autor</a>
<table border="1" cellpadding="6">
    <tr><th>Nome</th><th>Nacionalidade</th><th>Obras publicadas</th><th></th></tr>
    <tr th:each="a, st : ${autores}">
        <td th:text="${a.nome}"></td>
        <td th:text="${a.nacionalidade}"></td>
        <td th:text="${a.obrasPublicadas}"></td>
        <td>
            <form th:action="@{/autores/excluir/{i}(i=${st.index})}" method="post">
                <button type="submit">Excluir</button>
            </form>
        </td>
    </tr>
</table>
</body>
</html>
