<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Nova categoria</title></head>
<body>
<nav th:replace="~{fragmentos/nav :: menu}"></nav>
<h1>Nova categoria</h1>
<form th:action="@{/categorias}" th:object="${categoria}" method="post">
    <p><label>Gênero: <input type="text" th:field="*{genero}" required></label></p>
    <button type="submit">Salvar</button>
    <a th:href="@{/categorias}">Cancelar</a>
</form>
</body>
</html>
